# Experimental, loaded at startup. Baseline presentation remains available.
mode=original
width=1920
height=1080
render_percent=100
# Optional GPU backend. A renderer change takes effect after restart.
renderer=d3d11
# First interactive launch opens sonic-config.exe; background tests skip it.
setup_complete=0
presentation_fps=144
window_mode=windowed
# Original keeps the game's camera; Recompiled enables right-stick orbit in gameplay.
camera_style=original
# Use game, or a language name. Explicit choices persist on normal saving.
text_language=game
voice_language=game
subtitles=game
